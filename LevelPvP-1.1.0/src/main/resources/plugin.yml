name: LevelPvP
version: '${version}'
main: de.levelpvp.LevelPvPPlugin
api-version: '26.2'
author: LevelPvP
description: Level progression, heart scaling, delivery menus and level crystals.
commands:
  stats:
    description: Opens your LevelPvP statistics.
    usage: /stats
  delivery:
    description: Opens your delivery inbox or sending menu.
    usage: /delivery
  estractlevel:
    description: Converts levels into transferable level crystals.
    usage: /estractlevel <amount>
  levelcap:
    description: Sets global or individual level caps.
    usage: /levelcap <player> <1-50> | /levelcap reset <player> | /levelcap global <1-50>
  pvpmod:
    description: LevelPvP administration.
    usage: /pvpmod <reload|setlevel|addlevel|removelevel|stats|reset>
permissions:
  levelpvp.admin:
    description: Allows LevelPvP administration.
    default: op
