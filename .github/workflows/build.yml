name: Build LevelPvP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 25 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Projekt mit Gradle bauen
        working-directory: LevelPvP-1.1.0
        run: gradle clean build

      - name: Plugin-JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: LevelPvP-1.1.0
          path: LevelPvP-1.1.0/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
